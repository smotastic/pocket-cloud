services:
  gitea:
    image: gitea/gitea:28.2.0-rootless
    container_name: gitea
    restart: unless-stopped
    environment:
      GITEA__database__DB_TYPE: sqlite3
      GITEA__server__DOMAIN: ${GITEA_DOMAIN}
      GITEA__server__ROOT_URL: http://${GITEA_DOMAIN}:${GITEA_HTTP_PORT}/
      GITEA__server__SSH_DOMAIN: ${GITEA_DOMAIN}
      GITEA__server__SSH_PORT: ${GITEA_SSH_PORT}
      GITEA__service__DISABLE_REGISTRATION: "true"
      # `git push gitea:<owner>/<repo>.git` creates the repo (private) if it doesn't exist.
      GITEA__repository__ENABLE_PUSH_CREATE_USER: "true"
      GITEA__repository__DEFAULT_PUSH_CREATE_PRIVATE: "true"
    volumes:
      - ${DATA_ROOT}/gitea/data:/var/lib/gitea
      - ${DATA_ROOT}/gitea/config:/etc/gitea
    ports:
      - ${GITEA_HTTP_PORT}:3000
      - ${GITEA_SSH_PORT}:2222
