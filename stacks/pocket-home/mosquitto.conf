# Mosquitto broker for pocket-home. Mounted read-only from the repo.

# Plain TCP for the Shelly BLU Gateway until it moves to TLS (smotastic/pocket-home#42).
listener 1883
protocol mqtt

# TLS with the broker's own CA (scripts/pocket-home-mqtt-certs.sh). Same users and ACL.
listener 8883
protocol mqtt
cafile /mosquitto/config/certs/ca.crt
certfile /mosquitto/config/certs/broker.crt
keyfile /mosquitto/config/certs/broker.key
tls_version tlsv1.2

# Password auth and per-user topic rules, for every listener. Both files are generated
# from .env by the container's entrypoint.
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

# Keep retained messages, subscriptions and queued QoS 1/2 messages of persistent
# sessions (clean_session false) across broker restarts.
persistence true
persistence_location /mosquitto/data/
autosave_interval 60
persistent_client_expiration 14d

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
