# Mosquitto broker for pocket-home. Mounted read-only from the repo.

listener 1883
protocol mqtt

# Password auth only. The file is generated from .env by the container's entrypoint.
allow_anonymous false
password_file /mosquitto/config/passwd

# Keep retained messages, subscriptions and queued QoS 1/2 messages of persistent
# sessions (clean_session false) across broker restarts.
persistence true
persistence_location /mosquitto/data/
autosave_interval 60
persistent_client_expiration 14d

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
