services:
  docmost:
    image: docmost/docmost:0.96.0
    container_name: docmost
    restart: unless-stopped
    depends_on:
      docmost-postgres:
        condition: service_healthy
      docmost-redis:
        condition: service_started
    environment:
      # Used for invite links and redirects; the address phones and browsers open.
      APP_URL: ${DOCMOST_APP_URL}
      APP_SECRET: ${DOCMOST_APP_SECRET}
      DATABASE_URL: postgresql://docmost:${DOCMOST_DB_PASSWORD}@docmost-postgres:5432/docmost
      REDIS_URL: redis://docmost-redis:6379
      STORAGE_DRIVER: local
      DISABLE_TELEMETRY: "true"
    volumes:
      - ${DATA_ROOT}/docmost/storage:/app/data/storage
    ports:
      - ${DOCMOST_HTTP_PORT}:3000

  docmost-postgres:
    image: postgres:18.6-alpine
    container_name: docmost-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: docmost
      POSTGRES_USER: docmost
      # Only applied when Postgres initialises its data directory on the first start.
      POSTGRES_PASSWORD: ${DOCMOST_DB_PASSWORD}
    healthcheck:
      test: [CMD, pg_isready, -U, docmost, -d, docmost]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      # Postgres 18 keeps its data in a versioned subdirectory (18/docker) below this.
      - ${DATA_ROOT}/docmost/postgres:/var/lib/postgresql

  docmost-redis:
    image: redis:8.10.2-alpine
    container_name: docmost-redis
    restart: unless-stopped
    # Only collaboration state and job queues, nothing worth keeping: no persistence,
    # no bind mount, not backed up. noeviction because the job queue needs it.
    command: [redis-server, --save, "", --appendonly, "no", --maxmemory-policy, noeviction]
