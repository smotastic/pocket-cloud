# Metrics arrive over OTLP; Prometheus scrapes only itself, cAdvisor and Gitea.
global:
  scrape_interval: 30s

otlp:
  # service.name and service.instance.id become the job and instance labels.
  promote_resource_attributes:
    - service.name
    - service.version
    - deployment.environment.name

storage:
  tsdb:
    # OTLP pushes can arrive slightly out of order (batching, retries).
    out_of_order_time_window: 30m

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]

  - job_name: cadvisor
    static_configs:
      - targets: [cadvisor:8080]

  - job_name: gitea
    authorization:
      credentials_file: /etc/prometheus/gitea-metrics-token
    static_configs:
      - targets: [gitea:3000]
