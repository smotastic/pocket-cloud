# Metrics arrive over OTLP; Prometheus scrapes itself, cAdvisor, node-exporter,
# Alertmanager and Gitea. Alert rules are in alerts.yml.
global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

otlp:
  # service.name and service.instance.id become the job and instance labels.
  promote_resource_attributes:
    - service.name
    - service.version
    - deployment.environment.name

storage:
  tsdb:
    # OTLP pushes can arrive slightly out of order (batching, retries).
    out_of_order_time_window: 30m

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]

  - job_name: cadvisor
    static_configs:
      - targets: [cadvisor:8080]

  - job_name: node-exporter
    static_configs:
      - targets: [node-exporter:9100]

  - job_name: alertmanager
    static_configs:
      - targets: [alertmanager:9093]

  - job_name: gitea
    authorization:
      credentials_file: /etc/prometheus/gitea-metrics-token
    static_configs:
      - targets: [gitea:3000]
