services:
  prometheus:
    image: prom/prometheus:v3.15.0
    container_name: prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # Services push metrics over OTLP/HTTP to /api/v1/otlp/v1/metrics.
      - --web.enable-otlp-receiver
      - --storage.tsdb.retention.time=30d
      - --storage.tsdb.retention.size=5GB
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ${DATA_ROOT}/observability/prometheus:/prometheus
    ports:
      - ${PROMETHEUS_PORT}:9090

  # Per-container CPU and memory of the Colima VM, scraped by Prometheus.
  # Sees the VM's cgroups, not the Mac itself.
  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.6
    container_name: cadvisor
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/kmsg
    command:
      - --docker_only=true
      - --housekeeping_interval=30s
      - --enable_metrics=cpu,memory,oom_event
      # Keep only the compose service label instead of every container label.
      - --store_container_labels=false
      - --whitelisted_container_labels=com.docker.compose.service
    # Host paths inside the Colima VM, read-only.
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro

  # Logs: Alloy tails every container's output, services can also push OTLP logs.
  # Not published; Grafana and the services reach it as loki:3100.
  loki:
    image: grafana/loki:3.7.9
    container_name: loki
    restart: unless-stopped
    command:
      - -config.file=/etc/loki/loki.yaml
    volumes:
      - ./loki.yaml:/etc/loki/loki.yaml:ro
      - ${DATA_ROOT}/observability/loki:/loki

  alloy:
    image: grafana/alloy:v1.21.3
    container_name: alloy
    restart: unless-stopped
    depends_on:
      - loki
    command:
      - run
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    # Read-only Docker API access to list containers and read their logs. The data
    # directory keeps the read positions, so a recreated container doesn't resend logs.
    volumes:
      - ./config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${DATA_ROOT}/observability/alloy:/var/lib/alloy/data

  grafana:
    image: grafana/grafana:13.2.3
    container_name: grafana
    restart: unless-stopped
    depends_on:
      - prometheus
      - loki
    environment:
      # Only applied when Grafana creates its database on the first start.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ${DATA_ROOT}/observability/grafana:/var/lib/grafana
    ports:
      - ${GRAFANA_HTTP_PORT}:3000
