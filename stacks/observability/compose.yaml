services:
  prometheus:
    image: prom/prometheus:v3.15.0
    container_name: prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # Services push metrics over OTLP/HTTP to /api/v1/otlp/v1/metrics.
      - --web.enable-otlp-receiver
      - --storage.tsdb.retention.time=30d
      - --storage.tsdb.retention.size=5GB
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alerts.yml:/etc/prometheus/alerts.yml:ro
      - ${DATA_ROOT}/observability/prometheus:/prometheus
    configs:
      - source: gitea-metrics-token
        target: /etc/prometheus/gitea-metrics-token
    ports:
      - ${PROMETHEUS_PORT}:9090

  # Per-container CPU and memory of the Colima VM, scraped by Prometheus.
  # Sees the VM's cgroups, not the Mac itself.
  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.6
    container_name: cadvisor
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/kmsg
    command:
      - --docker_only=true
      - --housekeeping_interval=30s
      - --enable_metrics=cpu,memory,oom_event
      # Keep only the compose service label instead of every container label.
      - --store_container_labels=false
      - --whitelisted_container_labels=com.docker.compose.service
    # Host paths inside the Colima VM, read-only.
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro

  # Disk usage of the Colima VM (system disk and the /var/lib/docker data disk), for
  # the alerts in alerts.yml. Sees the VM, not the Mac.
  node-exporter:
    image: prom/node-exporter:v1.12.1
    container_name: node-exporter
    restart: unless-stopped
    pid: host
    command:
      - --path.rootfs=/host
    volumes:
      - /:/host:ro,rslave

  # Sends the alerts that Prometheus fires to Discord. Silences live in its data dir.
  alertmanager:
    image: prom/alertmanager:v0.34.2
    container_name: alertmanager
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --web.external-url=http://localhost:${ALERTMANAGER_PORT}
    secrets:
      - alerts_discord_webhook_url
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ${DATA_ROOT}/observability/alertmanager:/alertmanager
    ports:
      - ${ALERTMANAGER_PORT}:9093

  # Logs: Alloy tails every container's output, services can also push OTLP logs.
  # Not published; Grafana and the services reach it as loki:3100.
  loki:
    image: grafana/loki:3.7.9
    container_name: loki
    restart: unless-stopped
    command:
      - -config.file=/etc/loki/loki.yaml
    volumes:
      - ./loki.yaml:/etc/loki/loki.yaml:ro
      - ${DATA_ROOT}/observability/loki:/loki

  alloy:
    image: grafana/alloy:v1.21.3
    container_name: alloy
    restart: unless-stopped
    depends_on:
      - loki
    command:
      - run
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    # Read-only Docker API access to list containers and read their logs. The data
    # directory keeps the read positions, so a recreated container doesn't resend logs.
    volumes:
      - ./config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${DATA_ROOT}/observability/alloy:/var/lib/alloy/data

  grafana:
    image: grafana/grafana:13.2.3
    container_name: grafana
    restart: unless-stopped
    depends_on:
      - prometheus
      - loki
    environment:
      # Only applied when Grafana creates its database on the first start.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ${DATA_ROOT}/observability/grafana:/var/lib/grafana
    ports:
      - ${GRAFANA_HTTP_PORT}:3000

configs:
  # Bearer token for scraping Gitea; prometheus.yml can't read environment variables.
  # An empty value would make Compose mount the stack folder instead, hence the
  # placeholder: Gitea ignores the header when it has no token itself.
  gitea-metrics-token:
    content: ${GITEA_METRICS_TOKEN:-unset}

# Mounted as files under /run/secrets/ in the alertmanager container.
secrets:
  alerts_discord_webhook_url:
    environment: ALERTS_DISCORD_WEBHOOK_URL
