# Every alert goes to one Telegram chat. The bot token and chat ID come from .env
# as compose secrets (see compose.yaml), so this file holds no secrets.
route:
  receiver: telegram
  group_by: [alertname, mountpoint]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 12h

# A critical alert replaces the warning for the same disk.
inhibit_rules:
  - source_matchers: [severity="critical"]
    target_matchers: [severity="warning"]
    equal: [mountpoint]

receivers:
  - name: telegram
    telegram_configs:
      - bot_token_file: /run/secrets/alerts_telegram_bot_token
        chat_id_file: /run/secrets/alerts_telegram_chat_id
        send_resolved: true
