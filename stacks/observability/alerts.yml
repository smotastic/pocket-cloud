# Alert rules, evaluated by Prometheus and sent through Alertmanager to Discord.
groups:
  - name: colima-vm
    rules:
      # /var/lib/docker holds images, containers and build cache (the VM's data disk);
      # / is the VM's system disk. Data under ${DATA_ROOT} is on the Mac, not here.
      - alert: VmDiskFilling
        expr: |
          1 - node_filesystem_avail_bytes{job="node-exporter", mountpoint=~"/|/var/lib/docker"}
            / node_filesystem_size_bytes{job="node-exporter", mountpoint=~"/|/var/lib/docker"} > 0.80
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Colima VM disk {{ $labels.mountpoint }} is {{ $value | humanizePercentage }} full
          description: >-
            Check `docker system df`. BuildKit GC doesn't cap the build cache, so check
            `scripts/install-build-cache-prune.sh status`, then prune by age with
            `docker builder prune -af --filter until=2h`.

      - alert: VmDiskAlmostFull
        expr: |
          1 - node_filesystem_avail_bytes{job="node-exporter", mountpoint=~"/|/var/lib/docker"}
            / node_filesystem_size_bytes{job="node-exporter", mountpoint=~"/|/var/lib/docker"} > 0.90
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Colima VM disk {{ $labels.mountpoint }} is {{ $value | humanizePercentage }} full
          description: >-
            Builds and container writes fail once it is full. Free space now:
            `docker builder prune -af --filter until=1h`, then `docker system df`.

      # CI builds can add 10 GB of build cache in 20 minutes, so the fixed thresholds above
      # leave little time. This fires on the trend first, while the disk is still over half
      # empty; the 60 % floor keeps a single build from paging on an empty disk.
      - alert: VmDiskFillingFast
        expr: |
          predict_linear(node_filesystem_avail_bytes{job="node-exporter", mountpoint="/var/lib/docker"}[30m], 2 * 3600) < 0
            and 1 - node_filesystem_avail_bytes{job="node-exporter", mountpoint="/var/lib/docker"}
              / node_filesystem_size_bytes{job="node-exporter", mountpoint="/var/lib/docker"} > 0.60
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Colima VM disk {{ $labels.mountpoint }} fills up within 2 hours at the current rate
          description: >-
            Most likely BuildKit cache from CI builds. Check
            `scripts/install-build-cache-prune.sh status`, then
            `docker builder prune -af --filter until=2h`.

  - name: mac
    rules:
      # The Mac's disk that holds ${DATA_ROOT}, pushed every minute by
      # scripts/disk-metrics.sh. On APFS the size is the whole container's.
      - alert: MacDiskFilling
        expr: |
          1 - mac_filesystem_avail_bytes{job="mac-disk"}
            / mac_filesystem_size_bytes{job="mac-disk"} > 0.80
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Mac disk {{ $labels.mountpoint }} is {{ $value | humanizePercentage }} full
          description: >-
            Service data and the Colima VM's disk images live here. Check
            `du -sh "$DATA_ROOT"/* ~/.colima`.

      - alert: MacDiskAlmostFull
        expr: |
          1 - mac_filesystem_avail_bytes{job="mac-disk"}
            / mac_filesystem_size_bytes{job="mac-disk"} > 0.90
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Mac disk {{ $labels.mountpoint }} is {{ $value | humanizePercentage }} full
          description: >-
            Databases, Gitea and the backups fail once it is full. Free space now, starting with
            `du -sh "$DATA_ROOT"/*`.

  - name: monitoring
    rules:
      # The Mac's disk metrics are pushed, not scraped; a stopped agent would
      # otherwise silently stop the alerts above.
      - alert: MacDiskMetricsMissing
        expr: absent_over_time(mac_filesystem_avail_bytes{job="mac-disk"}[10m])
        labels:
          severity: warning
        annotations:
          summary: No disk metrics from the Mac for 10 minutes
          description: "`scripts/install-disk-metrics.sh status` and `scripts/install-disk-metrics.sh run-now`."

      # Without this, a dead exporter would silently stop the alerts above.
      - alert: ScrapeTargetDown
        expr: up{job=~"node-exporter|cadvisor|alertmanager"} == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Prometheus can't scrape {{ $labels.job }}
          description: "`docker compose ps` and `docker compose logs {{ $labels.job }}`."
