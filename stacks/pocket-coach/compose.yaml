services:
  pocket-coach-postgres:
    image: postgres:17.11-alpine
    container_name: pocket-coach-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: pocket-coach
      POSTGRES_DB: pocket-coach
      # Only applied when Postgres initialises an empty data directory.
      POSTGRES_PASSWORD: ${POCKET_COACH_DB_PASSWORD}
    volumes:
      - ${DATA_ROOT}/pocket-coach/postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U pocket-coach -d pocket-coach]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: applies pending migrations (schema `coach`) on every `up`, then exits.
  pocket-coach-migrate:
    image: ${GITEA_REGISTRY}/smotastic/pocket-coach-server:${POCKET_COACH_VERSION}
    container_name: pocket-coach-migrate
    restart: "no"
    command: [node, --enable-source-maps, dist/migrate.js]
    environment:
      DATABASE_URL: postgres://pocket-coach:${POCKET_COACH_DB_PASSWORD}@pocket-coach-postgres:5432/pocket-coach
    depends_on:
      pocket-coach-postgres:
        condition: service_healthy

  # The API, the Garmin sync and the coach's daily jobs (one process, ADR 0017 of pocket-coach).
  # Calls the model with the owner's Pi login, refreshed in place, like the learning coach.
  pocket-coach-server:
    image: ${GITEA_REGISTRY}/smotastic/pocket-coach-server:${POCKET_COACH_VERSION}
    container_name: pocket-coach-server
    restart: unless-stopped
    environment:
      PORT: "3000"
      DATABASE_URL: postgres://pocket-coach:${POCKET_COACH_DB_PASSWORD}@pocket-coach-postgres:5432/pocket-coach
      POCKET_COACH_SECRET_KEY: ${POCKET_COACH_SECRET_KEY}
      POCKET_COACH_TIME_ZONE: ${POCKET_COACH_TIME_ZONE:-Europe/Berlin}
      POCKET_COACH_PUBLIC_URL: ${POCKET_COACH_PUBLIC_URL:-}
      POCKET_COACH_DISCORD_WEBHOOK: ${POCKET_COACH_DISCORD_WEBHOOK:-}
      POCKET_COACH_PROVIDER: ${POCKET_COACH_PROVIDER}
      POCKET_COACH_MODEL: ${POCKET_COACH_MODEL}
      POCKET_COACH_THINKING: ${POCKET_COACH_THINKING:-off}
      # Empty: the Pi login below is used.
      POCKET_COACH_API_KEY: ${POCKET_COACH_API_KEY:-}
      POCKET_COACH_PI_AUTH_FILE: /pi/auth.json
      # Voice messages: the whisper stack, reached inside the Compose network.
      POCKET_COACH_SPEECH_URL: http://whisper:8000/v1
      POCKET_COACH_SPEECH_MODEL: ${WHISPER_MODEL:-Systran/faster-whisper-small}
      # Metrics only: Prometheus accepts no traces or logs.
      OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: http://prometheus:9090/api/v1/otlp/v1/metrics
      OTEL_SERVICE_NAME: pocket-coach
      OTEL_RESOURCE_ATTRIBUTES: service.version=${POCKET_COACH_VERSION},deployment.environment.name=production
    volumes:
      # Garmin's original activity files (ZIP with the FIT file).
      - ${DATA_ROOT}/pocket-coach/files:/data
      # Pi's agent directory, read and written: the coach refreshes the login under Pi's lock.
      - ${POCKET_COACH_PI_AGENT_DIR}:/pi
    depends_on:
      pocket-coach-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, node, -e, "fetch('http://localhost:3000/health/ready').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3

  # nginx: serves the web app and proxies /api, /docs and /health to the server.
  pocket-coach-web:
    image: ${GITEA_REGISTRY}/smotastic/pocket-coach-web:${POCKET_COACH_VERSION}
    container_name: pocket-coach-web
    restart: unless-stopped
    environment:
      COACH_SERVER_HOST: pocket-coach-server
      COACH_SERVER_PORT: "3000"
    depends_on:
      pocket-coach-server:
        condition: service_started
    ports:
      - ${POCKET_COACH_HTTP_PORT}:8080
